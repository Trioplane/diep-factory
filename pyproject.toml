[project]
name = "diep-factory"
version = "0.1.0"
description = "Provides an API to make or modify diep-packs."
readme = "README.md"
authors = [
    { name = "trplnr", email = "triopane30@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
